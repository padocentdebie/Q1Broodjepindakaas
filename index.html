<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Politieschool - Centraal Gestuurd</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; margin: 0; background: #002244; color: white; height: 100vh; display: flex; flex-direction: column; }
        
        /* Overlay voor login */
        #login-overlay { position: fixed; inset: 0; background: #001a33; display: flex; justify-content: center; align-items: center; z-index: 100; }
        .login-box { background: white; color: #333; padding: 30px; border-radius: 8px; width: 320px; text-align: center; }

        /* Content Areas */
        .screen { display: none; flex-direction: column; height: 100vh; padding: 20px; }
        .active { display: flex; }

        /* Specifieke elementen */
        /* === VERGROOT IFRAME VOOR POWERPOINT-LOOK === */
        iframe { 
            width: 100%; 
            flex-grow: 1; 
            min-height: 70vh;      /* zorgt voor royale hoogte */
            border: none; 
            border-radius: 8px; 
            background: white; 
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        }
        /* === EINDE VERGROOT IFRAME === */

        .feed { height: 300px; overflow-y: auto; background: rgba(255,255,255,0.1); padding: 15px; margin: 10px 0; border-radius: 4px; }
        .msg { margin-bottom: 8px; padding: 5px; border-bottom: 1px solid rgba(255,255,255,0.2); }
        
        /* Controls */
        .admin-panel { background: #cc0000; padding: 10px; display: flex; justify-content: space-around; position: sticky; top: 0; z-index: 50; flex-wrap: wrap; gap: 8px; }
        .controls { background: rgba(255,255,255,0.1); padding: 20px; border-radius: 8px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border-radius: 4px; border: none; }
        button { padding: 12px 24px; background: #0055aa; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #0077cc; }
        .nav-btn { background: #ffcc00; color: #000; }

        /* kleine aanpassing voor scherm 2: betere verdeling */
        #view2 { gap: 10px; }
        #view2 iframe { flex: 1 1 auto; }
    </style>
</head>
<body>

    <div id="admin-controls" class="admin-panel" style="display:none;">
        <strong>DOCENT MODUS:</strong>
        <button class="nav-btn" onclick="setGlobalScreen(1)">Scherm 1 (Login)</button>
        <button class="nav-btn" onclick="setGlobalScreen(2)">Scherm 2 (Presentatie)</button>
        <button class="nav-btn" onclick="setGlobalScreen(3)">Scherm 3 (Pindakaas)</button>
        <button onclick="resetAllData()" style="background:black;">Reset Alles</button>
    </div>

    <div id="login-overlay">
        <div class="login-box">
            <h2>Politieschool Q1</h2>
            <input type="text" id="username" placeholder="Naam">
            <select id="natoclass">
                <option value="Alpha">Alpha</option><option value="Bravo">Bravo</option>
                <option value="Charlie">Charlie</option><option value="Delta">Delta</option>
                <option value="Echo">Echo</option><option value="Foxtrot">Foxtrot</option>
                <option value="Golf">Golf</option><option value="Hotel">Hotel</option>
                <option value="Juliet">Juliet</option><option value="Kilo">Kilo</option>
                <option value="Lima">Lima</option><option value="Mike">Mike</option>
            </select>
            <button onclick="login()">Deelnemen</button>
            <p style="font-size: 10px; color: #999; margin-top: 20px; cursor: pointer;" onclick="enableAdmin()">Docent login</p>
        </div>
    </div>

    <div id="view1" class="screen">
        <h1>Welkom bij de les</h1>
        <p>Wacht tot de docent de presentatie start...</p>
    </div>

    <div id="view2" class="screen">
        <h3>Live Analyse: Klas <span id="display-class"></span></h3>
        <!-- iframe is nu groter door de CSS-aanpassing hierboven -->
        <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vTdQf0fR6wtSduvzQCpyVSB-ZHENUMs9JPd8yu8b8eqWgBnGPsP8inXQLo46xfldcX_YeaWobOibYKF/pubembed?start=true&loop=true&delayms=3000"></iframe>
        <div id="live-feed" class="feed"></div>
        <div class="controls">
            <input type="text" id="observation" placeholder="Typ hier de fout die je ziet...">
            <button onclick="sendObservation()">Verstuur</button>
        </div>
    </div>

    <div id="view3" class="screen">
        <h1>Opdracht: Stappenplan Broodje Pindakaas</h1>
        <p>Beschrijf exact hoe de docent een broodje moet smeren en opeten.</p>
        <textarea id="pindakaas-plan" style="height: 300px;" placeholder="Stap 1..."></textarea>
        <button onclick="submitPlan()">Opslaan</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, set, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB12mTMBnuxdC4W4htyFO_C7Dnh3maVKew",
            authDomain: "decoroefening.firebaseapp.com",
            databaseURL: "https://decoroefening-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "decoroefening",
            storageBucket: "decoroefening.firebasestorage.app",
            messagingSenderId: "945998495824",
            appId: "1:945998495824:web:a76dc7519b3b262a021155"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let user = "";
        let nato = "";
        let isAdmin = false;

        // DOCENT FUNCTIES
        window.enableAdmin = function() {
            const pw = prompt("Wachtwoord docent:");
            if(pw === "docent") { // Simpel wachtwoord
                isAdmin = true;
                document.getElementById('admin-controls').style.display = 'flex';
            }
        }

        window.setGlobalScreen = function(num) {
            set(ref(db, 'currentScreen'), num);
        }

        window.resetAllData = function() {
            if(confirm("DANGER: Dit verwijdert alle inzendingen van studenten!")) {
                remove(ref(db, 'observations'));
                remove(ref(db, 'plans'));
                set(ref(db, 'currentScreen'), 1);
            }
        }

        // STUDENT FUNCTIES
        window.login = function() {
            user = document.getElementById('username').value.trim();
            nato = document.getElementById('natoclass').value;
            if(!user) return alert("Naam verplicht");
            
            document.getElementById('display-class').innerText = nato;
            document.getElementById('login-overlay').style.display = 'none';
            
            // Luister naar welk scherm getoond moet worden
            onValue(ref(db, 'currentScreen'), (snap) => {
                const screenNum = snap.val() || 1;
                document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
                const target = document.getElementById('view' + screenNum);
                if(target) target.classList.add('active');
            });

            startFeed();
        }

        window.sendObservation = function() {
            const text = document.getElementById('observation').value.trim();
            if(!text) return;
            push(ref(db, 'observations'), { user, nato, text, time: Date.now() });
            document.getElementById('observation').value = "";
        }

        function startFeed() {
            onValue(ref(db, 'observations'), (snap) => {
                const feed = document.getElementById('live-feed');
                feed.innerHTML = "";
                snap.forEach(child => {
                    const data = child.val();
                    if(data.nato === nato) {
                        feed.innerHTML += `<div class="msg"><strong>${data.user}:</strong> ${data.text}</div>`;
                    }
                });
                feed.scrollTop = feed.scrollHeight;
            });
        }

        window.submitPlan = function() {
            const plan = document.getElementById('pindakaas-plan').value;
            set(ref(db, 'plans/' + user), { nato, plan }).then(() => alert("Opgeslagen!"));
        }
    </script>
</body>
</html>
